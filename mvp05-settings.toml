display_mode = "fullscreen"
# 0 x 0: your screen's own resolution (fullscreen then never switches the screen to another mode)
width = 0
height = 0
render_percent = 100
fps_cap = 60
vsync = true
# Low latency: at most one finished frame waits for the screen instead of up to three, for less delay between a
# button and the screen. Off by default: it can stutter on a slower PC. Restart after changing.
low_latency = false
anisotropic_filtering = 16
# Advertise Xbox 720p and HDTV AV pack on widescreen output. Restart after changing.
xbox_720p = true

# MVP05-Plus: GameCube controllers and PlayStation pads play as on their own releases, with their button art
# (gc_icons / ps2_icons beside the exe, made by the installer from your own discs).
gamecube_layout = true
gamecube_icons = true
playstation_layout = true
playstation_icons = true
# How many save backups to keep in "save backups" (0: off).
save_backups = 30
# Games in a season's schedule. The game counts them in schedule.big when it starts; this is only used if it can't.
# The Launcher's Schedule tab sets it.
season_games = 162
# Game Tweaks (the Launcher's Settings tab, Game Tweaks...).
# How fast pitchers get their stamina back between games, as a percent of the game's own pace (100: as the game).
# The game gives a pitcher back about a quarter of his stamina every day, so a starter is ready again two days after
# a full start and relievers are almost never tired. At 50 a starter needs about four days, like a five-man rotation.
pitcher_recovery = 100
# How long injured players are out in a dynasty, as a percent of the game's own lengths (100: as the game).
injury_length = 100
# The Xbox's RAM in MB: 64 (as the console) or 128, which grows the game's heap from 41 MB to 97 MB for mods that
# load more than the Xbox could hold.
memory_mb = 64
# Day games in daylight (lighting and sky) at the parks EA lit as dusk: Fenway, Turner Field, Crosley, Forbes,
# the Polo Grounds, ...
daylight_parks = false
# Rain: 0 as the game (showers in some games at SBC Park, and at Safeco Field at night), 1 the same at every
# outdoor park, 2 rain in every game.
rain = 0
# Umpires and fielders away from the play are given the game's second-best player model (it has ten of them)
# before its two simplest. The six at full detail stay six: the game's model files hold no more.
player_full_detail = false
# EA's depth of field (background blur), which the Xbox version has turned off (being tested).
depth_of_field = false
# Dynasty tweaks (the game's data tables), as percents of the game's own (100: as the game):
# how often ratings go up (dev_speed) and down (aging) each season, how often players retire, free agents' asking
# prices; resign_chance 100 plus or minus points; rookie_quality 1 or 2 for more, 3 for fewer
# star rookies.
dev_speed = 100
aging = 100
retirement = 100
contract_prices = 100
resign_chance = 100
rookie_quality = 0
