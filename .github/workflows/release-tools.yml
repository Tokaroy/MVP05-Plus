# Builds what a release needs besides MVP05.exe (which needs your own game files, so it's built on your PC):
#   MVP05-Plus-Launcher.exe  (Windows, PyInstaller)      gcbridge  (Linux, static, for SteamOS)
# Run it from the Actions tab (Run workflow), or it runs on a pushed tag. The files go on a draft release named
# tools-build (made fresh each run), where the release script downloads them: a release's files don't count against
# the Actions storage quota, as artifacts do (a full quota stops every upload for 6 to 12 hours).
name: release tools
on:
  workflow_dispatch:
  push:
    tags: ["v*", "beta-*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: A fresh tools-build draft release
        run: |
          gh release delete tools-build --yes 2>/dev/null || true
          gh release create tools-build --draft --title "tools-build (the release script's, made by each build)" \
            --notes "The Launcher and gcbridge from the latest release tools build. Not a release."

  installer:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/installer/requirements.txt
      - name: Test the disc readers, the updater, schedules, mods and the Launcher window
        run: |
          python tools/installer/tests/test_discs.py tools/installer
          python tools/installer/tests/test_updater.py tools/installer
          python tools/installer/tests/test_schedgen.py tools/installer
          python tools/installer/tests/test_schedule_share.py tools/installer
          python tools/installer/tests/test_mods.py
      - name: Test that the Launcher window builds
        continue-on-error: true
        run: python tools/installer/tests/test_gui_builds.py tools/installer
      - name: Build MVP05-Plus-Launcher.exe
        run: >
          pyinstaller --onefile --windowed --name MVP05-Plus-Launcher
          --paths tools/installer --paths tools/gc_layout --paths tools/ps2_layout --paths tools/saves --paths tools/saves/mvp05/lib
          --hidden-import make_icons --hidden-import mods --hidden-import dragdrop --hidden-import budget05 --hidden-import owner05 --hidden-import make_ps2_icons --hidden-import backups --hidden-import settings --hidden-import title_icon --hidden-import shortcuts --hidden-import controllers --hidden-import updater --hidden-import potd --hidden-import schedgen --hidden-import carryover --hidden-import gamepad_nav --hidden-import schedules --hidden-import saves05 --hidden-import rosters05 --hidden-import team_changer --hidden-import ps2card --hidden-import gccard --hidden-import news05 --hidden-import alltime05 --hidden-import gcroster05 --hidden-import ps2dynasty05 --hidden-import pcdynasty05 --hidden-import playoffs05 --hidden-import xb2gc --hidden-import standings_mem --hidden-import standings_patcher --hidden-import containers --hidden-import gc_checksums --hidden-import dynasty05 --hidden-import gc2xb_v0 --hidden-import xb2gc --hidden-import tablesconv --hidden-import postconv
          --add-data "tools/saves/mvp05/lib/*.json;mvp05/lib" --add-data "tools/installer/easter/*.png;easter" --add-data "tools/installer/holiday/*.png;holiday" --hidden-import holidays
          --collect-submodules iconlib
          tools/installer/install.py
      - name: Put it on the tools-build draft
        shell: bash
        run: gh release upload tools-build dist/MVP05-Plus-Launcher.exe --clobber

  gcbridge:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -O2 -march=x86-64 -static -s -o gcbridge tools/gcbridge/gcbridge.c
      - run: grep -c GCBRIDGE-PROTOCOL-3 gcbridge
      - name: Put it on the tools-build draft
        run: gh release upload tools-build gcbridge --clobber
